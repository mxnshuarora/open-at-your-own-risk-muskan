<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💌</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    text-align: center;
    background: #ffe6e6;
    overflow: hidden;
    padding-top: 50px;
  }
  h1 {
    color: #ff4d6d;
    font-size: 2.5em;
    margin-bottom: 50px;
  }
  button {
    padding: 15px 30px;
    font-size: 20px;
    margin: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
  }
  #yes {
    background-color: #ff4d6d;
    color: white;
    box-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d, 0 0 60px #ff4d6d;
    animation: pulse 1.5s infinite;
  }
  #no {
    background-color: #ccc;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d, 0 0 60px #ff4d6d; transform: scale(1); }
    50% { box-shadow: 0 0 30px #ff99aa, 0 0 50px #ff99aa, 0 0 70px #ff99aa; transform: scale(1.1); }
    100% { box-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d, 0 0 60px #ff4d6d; transform: scale(1); }
  }
  .heart {
    position: absolute;
    font-size: 24px;
    color: #ff4d6d;
    animation: floatUp 3s linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-600px); opacity: 0; }
  }
</style>
</head>
<body>

<h1>Will you be my Valentine, Muskan Pandey? 💖</h1>
<button id="yes">Yes</button>
<button id="no">No</button>

<script>
  const noBtn = document.getElementById('no');

  // Make "No" button jump around
  noBtn.addEventListener('mouseover', () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.position = 'absolute';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  });

  // Hearts animation
  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.innerText = '❤️';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }
  setInterval(createHeart, 500);

  // When "Yes" is clicked
  document.getElementById('yes').addEventListener('click', () => {
    alert("Yay! 💖 I knew you'd say yes!");
    const confettiCount = 100;
    for(let i=0; i<confettiCount; i++){
      createHeart();
    }
    setTimeout(() => {
      document.body.innerHTML = "<h1>I'm so happy! 🌹💖</h1>";
    }, 1000);
  });
</script>

</body>
</html>
